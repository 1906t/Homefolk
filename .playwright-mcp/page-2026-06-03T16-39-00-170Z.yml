    - generic [ref=e132]:
      - generic [ref=e133]: Ownership
      - heading "Owned by the community, forever." [level=2] [ref=e134]
      - paragraph [ref=e135]: homefolk layers three proven models so homes stay genuinely affordable for generations — an approach championed by former UN housing rapporteur Prof. Raquel Rolnik.
      - generic [ref=e136]:
        - generic [ref=e137]:
          - generic [ref=e138]: Community Land Trust
          - heading "CLT" [level=4] [ref=e139]
          - paragraph [ref=e140]: Separates the land from the building — residents pay only for the home, locking in affordability.
        - generic [ref=e141]:
          - generic [ref=e142]: Cooperative
          - heading "COOP" [level=4] [ref=e143]
          - paragraph [ref=e144]: Residents are shareholders with a secure right to live there for as long as they hold their share.
        - generic [ref=e145]:
          - generic [ref=e146]: Community Interest Company
          - heading "CIC" [level=4] [ref=e147]
          - paragraph [ref=e148]: A trusted company form that puts community benefit, not profit, first.
      - generic [ref=e149]:
        - generic [ref=e150]:
