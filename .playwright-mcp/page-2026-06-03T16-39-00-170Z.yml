    - generic [ref=e45]:
      - generic [ref=e46]:
        - generic [ref=e47]: The concept
        - heading "A small home. A real community." [level=2] [ref=e48]
        - paragraph [ref=e49]: A tiny-home is a compact, low-carbon house. Cluster around eight of them with shared kitchen, laundry and garden, and you get a tiny village — close-knit, far lighter on the planet than a standard home.
        - paragraph [ref=e50]: Because the pods are light-touch and need no foundations, they can sit on paved, underused land and be fully removed later. It's been done in towns before — never in a dense city like London.
      - generic [ref=e51]:
        - generic [ref=e52]: ~8 homes
        - text: a pilot village of tiny-homes plus communal facilities, grown from an existing neighbourhood so residents have a support network from day one.
