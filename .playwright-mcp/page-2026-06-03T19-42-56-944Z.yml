    - generic [ref=e47]:
      - generic [ref=e48]:
        - generic [ref=e49]: The concept
        - heading "A small home. A real community." [level=2] [ref=e50]
        - paragraph [ref=e51]: A tiny-home is a compact, low-carbon house. Cluster around eight of them with shared kitchen, laundry and garden, and you get a tiny village — close-knit, far lighter on the planet than a standard home.
        - paragraph [ref=e52]: Because the pods are light-touch and need no foundations, they can sit on paved, underused land and be fully removed later. It's been done in towns before — never in a dense city like London.
      - generic [ref=e53]:
        - generic [ref=e54]: ~8 homes
        - text: a pilot village of tiny-homes plus communal facilities, grown from an existing neighbourhood so residents have a support network from day one.
