    - generic [ref=e170]:
      - generic [ref=e171]: Ownership
      - heading "Owned by the community, forever." [level=2] [ref=e172]
      - paragraph [ref=e173]: homefolk layers three proven models so homes stay genuinely affordable for generations — an approach championed by former UN housing rapporteur Prof. Raquel Rolnik.
      - generic [ref=e174]:
        - generic [ref=e175]:
          - generic [ref=e176]: Community Land Trust
          - heading "CLT" [level=4] [ref=e177]
          - paragraph [ref=e178]: Separates the land from the building — residents pay only for the home, locking in affordability.
        - generic [ref=e179]:
          - generic [ref=e180]: Cooperative
          - heading "COOP" [level=4] [ref=e181]
          - paragraph [ref=e182]: Residents are shareholders with a secure right to live there for as long as they hold their share.
        - generic [ref=e183]:
          - generic [ref=e184]: Community Interest Company
          - heading "CIC" [level=4] [ref=e185]
          - paragraph [ref=e186]: A trusted company form that puts community benefit, not profit, first.
