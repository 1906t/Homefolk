    - generic [ref=e134]:
      - generic [ref=e135]: Ownership
      - heading "Owned by the community, forever." [level=2] [ref=e136]
      - paragraph [ref=e137]: homefolk layers three proven models so homes stay genuinely affordable for generations — an approach championed by former UN housing rapporteur Prof. Raquel Rolnik.
      - generic [ref=e138]:
        - generic [ref=e139]:
          - generic [ref=e140]: Community Land Trust
          - heading "CLT" [level=4] [ref=e141]
          - paragraph [ref=e142]: Separates the land from the building — residents pay only for the home, locking in affordability.
        - generic [ref=e143]:
          - generic [ref=e144]: Cooperative
          - heading "COOP" [level=4] [ref=e145]
          - paragraph [ref=e146]: Residents are shareholders with a secure right to live there for as long as they hold their share.
        - generic [ref=e147]:
          - generic [ref=e148]: Community Interest Company
          - heading "CIC" [level=4] [ref=e149]
          - paragraph [ref=e150]: A trusted company form that puts community benefit, not profit, first.
      - generic [ref=e151]:
        - generic [ref=e152]:
          - generic [ref=e153]: St Clements · Tower Hamlets
          - text: "London's first-ever CLT site: 252 new homes, 35% genuinely affordable, by and for local people."
        - generic [ref=e154]:
